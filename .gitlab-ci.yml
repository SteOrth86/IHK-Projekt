stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

test_backend:
  stage: test
  image: python:3.12-slim
  before_script:
    - python --version
    - pip install --upgrade pip
    # Anforderungen für das Backend installieren
    - pip install -r backend/requirements.txt
  script:
    - cd backend
    - pytest

