stages:
  - test
  - build
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

test_backend:
  stage: test
  image: python:3.12-slim
  before_script:
    - python --version
    - pip install --upgrade pip
    # Backend-Requirements aus dem Unterordner installieren
    - pip install --upgrade pip
    - pip install -r backend/requirements.txt
  script:
    - cd backend
    - mkdir -p reports
    - pytest --junitxml=reports/junit.xml
  artifacts:
    when: always
    paths:
      - backend/reports/
    reports:
      junit: backend/reports/junit.xml

build_backend_image:
  stage: build
  image: docker:26.0.0
  services:
    - docker:26.0.0-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  needs:
    - test_backend
  script:
    # Nur zur Kontrolle
    - docker version
    # Docker-Image aus dem Unterordner backend bauen
    - docker build -t ihk-backend:${CI_COMMIT_SHORT_SHA} backend/
